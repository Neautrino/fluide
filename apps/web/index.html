<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4f4" />
    <title>Fluide — your ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        if (localStorage.getItem('fluide.theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        if (localStorage.getItem('fluide.amountsHidden') === '1') {
          document.documentElement.classList.add('amounts-hidden');
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
